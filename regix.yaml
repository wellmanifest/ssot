regix:
  workdir: .

  # ── Quality gates ──────────────────────────────────────────
  gates:
    # Hard — violations block the pipeline (exit code 1)
    hard:
      cc: 15
      mi: 20
      coverage: 80
      length: 100
      docstring: 60
      quality: 0.85

    # Target — aspirational goals, reported as warnings
    target:
      cc: 10
      mi: 30
      coverage: 90
      length: 50
      docstring: 80
      quality: 0.95

    on_regression: warn
    fail_exit_code: 1

  # ── Delta thresholds (relative change between commits) ─────
  deltas:
    warn: 2
    error: 5

  # ── Backends ───────────────────────────────────────────────
  backends:
    cc: lizard
    mi: radon
    coverage: pytest-cov
    quality: none
    docstring: builtin
    # mi_granularity: module   # or "function" — score each function's own
    #                          # span so helper extraction (lower CC, more LOC)
    #                          # stops dropping module MI below the gate

  # ── File filtering ─────────────────────────────────────────
  include:
    - "src/**"

  exclude:
    - "tests/**"
    - "docs/**"
    - "examples/**"
    - "schemas/**"
    - "questions/**"
    - ".venv/**"

  # ── Output ─────────────────────────────────────────────────
  output:
    format: rich
    dir: .regix/
    show_improvements: true
